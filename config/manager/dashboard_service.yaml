apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: docker-workspace
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8082
      protocol: TCP
      targetPort: dashboard
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: docker-workspace
